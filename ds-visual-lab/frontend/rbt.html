<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Visual DSA Lab – Red Black Tree</title>

<style>
/* ✨ Magical / dreamy pastel theme – ONLY CSS changed */

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#fde2f3,#e0e7ff,#dcfce7);
    background-attachment:fixed;
}

/* Glass header */
header{
    background:rgba(255,255,255,0.45);
    backdrop-filter:blur(10px);
    color:#312e81;
    padding:12px 20px;
    font-size:20px;
    font-weight:bold;
    border-bottom:1px solid rgba(255,255,255,0.6);
}

#container{
    display:flex;
    height:calc(100vh - 50px);
}

/* Glass panels */
#leftPanel,
#rightPanel{
    background:rgba(255,255,255,0.65);
    backdrop-filter:blur(12px);
    padding:15px;
    border:1px solid rgba(255,255,255,0.6);
    box-shadow:0 12px 30px rgba(99,102,241,0.15);
}

#leftPanel{
    width:250px;
    border-right:none;
}

#rightPanel{
    width:260px;
    border-left:none;
}

/* Dreamy center panel */
#centerPanel{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top,#ffffffcc,#eef2ff,#fdf2f8);
}

/* Inputs */
input{
    width:100%;
    padding:8px;
    margin-top:8px;
    border-radius:10px;
    border:1px solid #c7d2fe;
    background:rgba(255,255,255,0.85);
    outline:none;
}

/* Magical buttons */
button{
    width:100%;
    padding:9px;
    margin-top:10px;
    border-radius:12px;
    border:none;
    background:linear-gradient(135deg,#a5b4fc,#fbcfe8);
    color:#312e81;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(139,92,246,0.35);
    transition:all 0.25s ease;
}

button:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 10px 26px rgba(139,92,246,0.45);
}

/* Magical SVG canvas */
#svgCanvas{
    border:2px dashed #c7d2fe;
    background:linear-gradient(180deg,#ffffff,#fdf4ff);
    border-radius:18px;
    box-shadow:
        inset 0 0 25px rgba(167,139,250,0.15),
        0 15px 35px rgba(99,102,241,0.18);
}
</style>
</head>

<body>

<header>Visual Data-Structure Performance Laboratory – Red Black Tree</header>

<div id="container">

<div id="leftPanel">
<h3>Operations</h3>
<input type="number" id="valueBox" placeholder="Enter value">
<button id="insertBtn">Insert</button>
<button id="searchBtn">Search</button>
</div>

<div id="centerPanel">
<svg id="svgCanvas" width="90%" height="90%"></svg>
</div>

<div id="rightPanel">
<h3>Legend</h3>
<div>🔴 Red node</div>
<div>⚫ Black node</div>
<div>🟢 Green border = search path</div>
</div>

</div>

<script>

/* ✅ Your original JavaScript – unchanged */

const svg = document.getElementById("svgCanvas");
const R = 18;

const RED = 0;
const BLACK = 1;

let root = null;

/* search animation */
let searchPath = [];
let highlightIndex = -1;
let playToken = 0;

/* ---------------- Node ---------------- */

function Node(key){
    this.key = key;
    this.left = null;
    this.right = null;
    this.parent = null;
    this.color = RED;
    this.x = 0;
    this.y = 0;
}

/* ---------------- BST insert ---------------- */

function bstInsert(z){
    let y = null;
    let x = root;

    while(x){
        y = x;
        if(z.key < x.key) x = x.left;
        else x = x.right;
    }

    z.parent = y;

    if(!y) root = z;
    else if(z.key < y.key) y.left = z;
    else y.right = z;
}

/* ---------------- Rotations ---------------- */

function leftRotate(x){
    let y = x.right;

    x.right = y.left;
    if(y.left) y.left.parent = x;

    y.parent = x.parent;

    if(!x.parent) root = y;
    else if(x === x.parent.left) x.parent.left = y;
    else x.parent.right = y;

    y.left = x;
    x.parent = y;
}

function rightRotate(y){
    let x = y.left;

    y.left = x.right;
    if(x.right) x.right.parent = y;

    x.parent = y.parent;

    if(!y.parent) root = x;
    else if(y === y.parent.left) y.parent.left = x;
    else y.parent.right = x;

    x.right = y;
    y.parent = x;
}

/* ---------------- Fix Red Black ---------------- */

function fixInsert(z){

    while(z.parent && z.parent.color === RED){

        if(z.parent === z.parent.parent.left){

            let y = z.parent.parent.right;

            if(y && y.color === RED){
                z.parent.color = BLACK;
                y.color = BLACK;
                z.parent.parent.color = RED;
                z = z.parent.parent;
            }
            else{
                if(z === z.parent.right){
                    z = z.parent;
                    leftRotate(z);
                }
                z.parent.color = BLACK;
                z.parent.parent.color = RED;
                rightRotate(z.parent.parent);
            }

        }else{

            let y = z.parent.parent.left;

            if(y && y.color === RED){
                z.parent.color = BLACK;
                y.color = BLACK;
                z.parent.parent.color = RED;
                z = z.parent.parent;
            }
            else{
                if(z === z.parent.left){
                    z = z.parent;
                    rightRotate(z);
                }
                z.parent.color = BLACK;
                z.parent.parent.color = RED;
                leftRotate(z.parent.parent);
            }

        }
    }

    root.color = BLACK;
}

/* ---------------- Public insert ---------------- */

function insertRBT(value){
    let z = new Node(value);
    bstInsert(z);
    fixInsert(z);
}

/* ---------------- Search trace ---------------- */

function searchTrace(n, key, path)
{
    if(!n) return;

    path.push(n);

    if(key === n.key) return;

    if(key < n.key) searchTrace(n.left, key, path);
    else searchTrace(n.right, key, path);
}

/* ---------------- Layout ---------------- */

function layout(n,d,minX,maxX){
    if(!n) return;

    n.x = (minX + maxX)/2;
    n.y = d*80 + 50;

    layout(n.left ,d+1,minX,n.x);
    layout(n.right,d+1,n.x,maxX);
}

/* ---------------- Drawing ---------------- */

function drawLine(x1,y1,x2,y2){

    const dx=x2-x1,dy=y2-y1;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(!dist) return;

    const sx=x1+dx*R/dist;
    const sy=y1+dy*R/dist;
    const ex=x2-dx*R/dist;
    const ey=y2-dy*R/dist;

    const l=document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1",sx);
    l.setAttribute("y1",sy);
    l.setAttribute("x2",ex);
    l.setAttribute("y2",ey);
    l.setAttribute("stroke","#555");
    svg.appendChild(l);
}

function isHighlighted(n)
{
    if(highlightIndex < 0) return false;
    return searchPath.slice(0, highlightIndex+1).includes(n);
}

function drawNode(n){

    if(!n) return;

    if(n.left)  drawLine(n.x,n.y,n.left.x,n.left.y);
    if(n.right) drawLine(n.x,n.y,n.right.x,n.right.y);

    drawNode(n.left);
    drawNode(n.right);

    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",n.x);
    c.setAttribute("cy",n.y);
    c.setAttribute("r",R);

    if(n.color === RED)
        c.setAttribute("fill","#e11d48");
    else
        c.setAttribute("fill","#000000");

    if(isHighlighted(n)){
        c.setAttribute("stroke","#22c55e");
        c.setAttribute("stroke-width","4");
    }

    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",n.x);
    t.setAttribute("y",n.y+5);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("fill","white");
    t.setAttribute("font-size","12");
    t.textContent=n.key;

    svg.appendChild(c);
    svg.appendChild(t);
}

function redraw(){
    svg.innerHTML="";
    layout(root,0,50,svg.clientWidth-50);
    drawNode(root);
}

/* ---------------- Search animation ---------------- */

function playSearchPath(){

    playToken++;
    const myToken = playToken;

    highlightIndex = -1;

    function step(){

        if(myToken !== playToken) return;

        highlightIndex++;

        if(highlightIndex >= searchPath.length){
            return;
        }

        redraw();
        setTimeout(step, 500);
    }

    step();
}

/* ---------------- UI ---------------- */

insertBtn.onclick = ()=>{

    const v = parseInt(valueBox.value);
    if(isNaN(v)) return;

    insertRBT(v);

    searchPath = [];
    highlightIndex = -1;

    redraw();
};

searchBtn.onclick = ()=>{

    const v = parseInt(valueBox.value);
    if(isNaN(v)) return;

    searchPath = [];
    highlightIndex = -1;

    const p = [];
    searchTrace(root, v, p);

    searchPath = p;

    playSearchPath();
};

</script>

</body>
</html>
